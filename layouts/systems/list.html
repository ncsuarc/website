{{ define "main" }}
  {{ partial "title.html" . }}
  <div class="container site-section">
    <div class="row">
      <div class="col-lg-12">
        <img class="img-responsive img-fit media-frame" src="{{ path.Join .Section .Params.image | relURL }}" alt="{{ .Title }} aerial system">
      </div>
    </div>

    <hr/>
    <div class="row">
      <div class="col-lg-12">
        {{ .Content }}
      </div>
    </div>
  </div><!-- ./container -->

  <div class="container pb-5" id="accordion">
    <hr/>
    {{ range .Pages }}
    {{ $id := substr (md5 .Title) 0 16}}
      <div class="card">
        <button class="card-header collapsed system-accordion-toggle" id="heading{{ $id }}" type="button" data-toggle="collapse" data-target="#collapse{{ $id }}" aria-expanded="false" aria-controls="collapse{{ $id }}">
          <span class="lead">
            <strong>
              {{ .Title }} <i class="fas fa-chevron-up" aria-hidden="true"></i>
            </strong>
          </span>
        </button><!-- ./card-header -->
        <div class="collapse" id="collapse{{ $id }}" aria-labelledby="heading{{ $id }}" data-parent="#accordion">
          <div class="card-body">
            <div class="row">
              <div class="col-sm-6">
                {{ .Content }}
              </div><!-- ./col -->
              <div class="col-sm-6 align-self-center">
                <img class="img-responsive img-fit media-frame" src="{{ path.Join .Section .Params.image | relURL }}" alt="{{ .Title }} subsystem">
              </div><!-- ./col -->
            </div><!-- ./row -->
          </div><!-- ./card-body -->
        </div><!-- ./collapse -->
      </div><!-- ./card -->
    {{ end }}
  </div><!-- ./container -->
{{ end }}
